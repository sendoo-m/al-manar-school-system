<!-- Modal إضافة عام دراسي جديد -->
<div class="modal fade" id="addAcademicYearModal" tabindex="-1" aria-labelledby="addAcademicYearModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addAcademicYearModalLabel">
                    <i class="fas fa-calendar-plus me-2"></i>إضافة عام دراسي جديد
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <form id="addAcademicYearForm" method="post">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="academicYearName" class="form-label">اسم العام الدراسي *</label>
                                <input type="text" class="form-control" id="academicYearName" name="name" 
                                       placeholder="مثال: 2025-2026" required>
                                <div class="form-text">مثال: 2025-2026</div>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-4">
                                <input class="form-check-input" type="checkbox" id="isCurrentYear" name="is_current">
                                <label class="form-check-label" for="isCurrentYear">
                                    تعيين كعام دراسي حالي
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="startDate" class="form-label">تاريخ بداية العام *</label>
                                <input type="date" class="form-control" id="startDate" name="start_date" required>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="endDate" class="form-label">تاريخ نهاية العام *</label>
                                <input type="date" class="form-control" id="endDate" name="end_date" required>
                            </div>
                        </div>
                    </div>
                    
                    <hr>
                    <h6 class="mb-3 text-primary">
                        <i class="fas fa-calendar-week me-2"></i>الفصول الدراسية
                    </h6>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="firstTermStart" class="form-label">بداية الفصل الأول *</label>
                                <input type="date" class="form-control" id="firstTermStart" name="first_term_start" required>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="firstTermEnd" class="form-label">نهاية الفصل الأول *</label>
                                <input type="date" class="form-control" id="firstTermEnd" name="first_term_end" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="secondTermStart" class="form-label">بداية الفصل الثاني *</label>
                                <input type="date" class="form-control" id="secondTermStart" name="second_term_start" required>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="secondTermEnd" class="form-label">نهاية الفصل الثاني *</label>
                                <input type="date" class="form-control" id="secondTermEnd" name="second_term_end" required>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>حفظ العام الدراسي
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('addAcademicYearForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;
    
    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>جاري الحفظ...';
    submitBtn.disabled = true;
    
    fetch('/settings/create-academic-year/', {
        method: 'POST',
        body: formData,
        headers: {
            'X-CSRFToken': getCookie('csrftoken')
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage('success', data.message);
            bootstrap.Modal.getInstance(document.getElementById('addAcademicYearModal')).hide();
            setTimeout(() => location.reload(), 1500);
        } else {
            showMessage('error', data.message);
        }
    })
    .finally(() => {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    });
});
</script>
