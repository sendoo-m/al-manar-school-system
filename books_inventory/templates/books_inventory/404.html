{% extends 'books_inventory/base.html' %}
{% load static %}

{% block title %}الصفحة غير موجودة - مخزن الكتب{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="text-center py-5">
            <i class="fas fa-search fa-5x text-muted mb-4"></i>
            <h1 class="display-4 text-muted">404</h1>
            <h4 class="mb-4">الصفحة غير موجودة</h4>
            <p class="text-muted mb-4">عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها</p>
            
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="list-group list-group-flush">
                        <a href="{% url 'books_inventory:inventory_home' %}" class="list-group-item list-group-item-action">
                            <i class="fas fa-home text-primary"></i> العودة للصفحة الرئيسية
                        </a>
                        <a href="{% url 'books_inventory:books_list' %}" class="list-group-item list-group-item-action">
                            <i class="fas fa-book text-primary"></i> عرض قائمة الكتب
                        </a>
                        <a href="{% url 'books_inventory:student_search_view' %}" class="list-group-item list-group-item-action">
                            <i class="fas fa-search text-primary"></i> البحث عن الطلاب
                        </a>
                        <a href="{% url 'books_inventory:inventory_reports' %}" class="list-group-item list-group-item-action">
                            <i class="fas fa-chart-bar text-primary"></i> التقارير
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
